<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dashboard {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 350px;
            border: 1px solid #334155;
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        .info-group {
            border-top: 1px solid #334155;
            padding: 12px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .label { color: #94a3b8; }
        .value { font-weight: 600; }
        
        .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            background: #334155;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="clock">00:00:00</div>
    
    <div class="info-group">
        <div class="info-row">
            <span class="label">Battery Level</span>
            <span class="value" id="bat-level">--%</span>
        </div>
        <div class="info-row">
            <span class="label">Status</span>
            <span class="value" id="bat-status">--</span>
        </div>
    </div>

    <div class="info-group">
        <div class="info-row">
            <span class="label">Audio Output</span>
            <span class="value" id="audio-device">Detecting...</span>
        </div>
    </div>

    <div class="info-group" style="font-size: 0.75rem; color: #64748b; text-align: center;">
        <div id="full-date"></div>
    </div>
</div>

<script>
    // --- Helper Logger ---
    function logHelper(msg, isError = false) {
        const timestamp = new Date().toLocaleTimeString();
        if (isError) console.error(`[Helper ${timestamp}] ❌:`, msg);
        else console.log(`[Helper ${timestamp}] ✅:`, msg);
    }

    // --- 12h Clock Logic ---
    function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        
        h = h % 12;
        h = h ? h : 12; // the hour '0' should be '12'
        
        document.getElementById('clock').textContent = `${h}:${m}:${s} ${ampm}`;
        document.getElementById('full-date').textContent = now.toDateString();
        setTimeout(updateClock, 1000);
    }

    // --- Battery Logic ---
    if ('getBattery' in navigator) {
        navigator.getBattery().then(battery => {
            const updateBattery = () => {
                const level = Math.round(battery.level * 100);
                document.getElementById('bat-level').textContent = `${level}%`;
                document.getElementById('bat-status').textContent = battery.charging ? "Charging" : "Discharging";
                logHelper(`Battery: ${level}%`);
            };
            updateBattery();
            battery.onlevelchange = updateBattery;
            battery.onchargingchange = updateBattery;
        }).catch(e => logHelper("Battery API Blocked", true));
    }

    // --- Audio Output Logic ---
    async function getAudioOutput() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioOut = devices.filter(device => device.kind === 'audiooutput');
            const activeDevice = audioOut.find(d => d.deviceId === 'default') || audioOut[0];
            
            if (activeDevice && activeDevice.label) {
                const name = activeDevice.label.replace(/^Default - /i, '');
                document.getElementById('audio-device').textContent = name;
                logHelper(`Audio: ${name}`);
            } else {
                document.getElementById('audio-device').textContent = "System Default";
            }
        } catch (err) {
            logHelper(`Audio Error: ${err.message}`, true);
        }
    }

    // Initialize
    updateClock();
    getAudioOutput();
    
    // Auto-update audio on hardware change
    navigator.mediaDevices.ondevicechange = getAudioOutput;

    // First click anywhere fixes labels if they are stuck
    document.body.addEventListener('click', () => {
        logHelper("Interaction detected, syncing labels...");
        getAudioOutput();
    }, { once: true });

    // Global Error Logger
    window.onerror = (m, s, l) => logHelper(`${m} at line ${l}`, true);
</script>

</body>
</html>
